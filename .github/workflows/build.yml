name: Build mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle + Forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg3-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-fg3-

      - name: Build with Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Set up Python for packager
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle install packs
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Bundling $JAR"
          python3 pack/pack.py "$JAR" --out dist --version "${{ github.sha }}"
          ls -la dist/

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: create-112-jar
          path: build/libs/*.jar

      - name: Install headless display deps
        if: success()
        run: |
          sudo apt-get update
          (sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri x11-xserver-utils xserver-xorg-video-dummy || sudo apt-get install -y xvfb mesa-utils || true)
          which Xvfb || true
          which xvfb-run || true

      - name: Real dedicated server smoke (registry crash catcher)
        if: success()
        run: |
          set +e
          rm -rf smokeserver && mkdir -p smokeserver/mods
          # Real pack contents (CTM is client-only, excluded like a real server)
          for j in dist/deps/*.jar; do
            case "$j" in
              *CTM-*) echo "skip $j (client-only)";;
              *) cp "$j" smokeserver/mods/ && echo "mod $j";;
            esac
          done
          ls -la smokeserver/mods/
          ATTEMPT=0
          INSTALLED=0
          while [ "$ATTEMPT" -lt 3 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== forge server install attempt $ATTEMPT/3 ==="
            rm -f forge-installer.jar
            curl -L --retry 2 -o forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-installer.jar" && \
            (cd smokeserver && java -jar ../forge-installer.jar --installServer > ../forge-install.log 2>&1)
            CODE=$?
            tail -n 15 forge-install.log || true
            if [ "$CODE" -eq 0 ] && ls smokeserver/forge-1.12.2-14.23.5.2859.jar >/dev/null 2>&1; then
              INSTALLED=1
              break
            fi
            echo "install attempt $ATTEMPT failed (exit $CODE), retrying in 10s..."
            sleep 10
          done
          if [ "$INSTALLED" -ne 1 ]; then
            echo "SERVER SMOKE FAILED: could not install Forge server after 3 attempts"
            exit 1
          fi
          echo "eula=true" > smokeserver/eula.txt
          (cd smokeserver && timeout 300 java -Xmx3G -jar forge-1.12.2-14.23.5.2859.jar nogui > ../server-smoke.log 2>&1)
          CODE=$?
          echo "server exit code: $CODE"
          tail -n 80 server-smoke.log || true
          echo "--- server marker scan ---"
          grep -E -i "Done \(|Dedicated Server|Minecraft Crash Report|ExceptionInInitializerError|IllegalStateException|Attempted to set registry name|Found a duplicate mod|Caught exception from|LoaderException|Caused by:" server-smoke.log | tail -n 40 || true
          if grep -q -E "Minecraft Crash Report|ExceptionInInitializerError|Attempted to set registry name|Found a duplicate mod|Caught exception from" server-smoke.log; then
            echo "SERVER SMOKE FAILED: crash marker found"
            exit 1
          fi
          if grep -q -E "Done \(" server-smoke.log; then
            echo "SERVER SMOKE PASSED: dedicated server reached Done"
            exit 0
          fi
          if [ "$CODE" -eq 124 ]; then
            echo "SERVER SMOKE FAILED: timed out before Done (see server-smoke.log)"
            exit 1
          fi
          echo "SERVER SMOKE FAILED: exit $CODE without Done marker"
          exit 1

      - name: Headless client smoke (title screen or timeout)
        if: success()
        run: |
          set +e
          mkdir -p run/mods
          for j in dist/deps/*.jar; do
            case "$j" in
              *create-1.12.2.jar*) echo "skip $j (dev classes already on classpath)";;
              *mixinbooter*) echo "skip $j (mixinbooter already on FG classpath via build.gradle)";;
              *) cp -n "$j" run/mods/ && echo "mod $j";;
            esac
          done
          rm -f client-smoke.log client-attempt.log
          ATTEMPT=0
          CODE=0
          while [ "$ATTEMPT" -lt 3 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== client attempt $ATTEMPT/3 ===" | tee -a client-smoke.log
            printf '%s\n' \
            'Section "ServerFlags"' \
            '    Option "DontVTSwitch" "true"' \
            '    Option "AllowMouseOpenFail" "true"' \
            'EndSection' \
            'Section "Device"' \
            '    Identifier "DummyDevice"' \
            '    Driver "dummy"' \
            '    VideoRam 256000' \
            'EndSection' \
            'Section "Monitor"' \
            '    Identifier "DummyMonitor"' \
            '    HorizSync 5.0-1000.0' \
            '    VertRefresh 5.0-200.0' \
            '    Modeline "1280x1024" 108.0 1280 1328 1440 1688 1024 1025 1028 1066' \
            'EndSection' \
            'Section "Screen"' \
            '    Identifier "DummyScreen"' \
            '    Device "DummyDevice"' \
            '    Monitor "DummyMonitor"' \
            '    DefaultDepth 24' \
            '    SubSection "Display"' \
            '        Depth 24' \
            '        Modes "1280x1024"' \
            '    EndSubSection' \
            'EndSection' > /tmp/xdummy.conf
            (sudo Xorg :99 -ac -config /tmp/xdummy.conf -logfile /tmp/xorg.log > /tmp/xorg.out 2>&1 &) || true
            sleep 5
            (DISPLAY=:99 xrandr || true) | tee -a client-smoke.log
            (DISPLAY=:99 xdpyinfo -ext RANDR 2>/dev/null | head -n 30 || true) | tee -a client-smoke.log
            DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 timeout 420 ./gradlew runClient --no-daemon --stacktrace > client-attempt.log 2>&1
            CODE=$?
            echo "attempt $ATTEMPT exit code: $CODE" | tee -a client-smoke.log
            cat client-attempt.log >> client-smoke.log
            if grep -q -E "Minecraft Crash Report|ExceptionInInitializerError|Attempted to set registry name|Found a duplicate mod|Duplicate Mods" client-attempt.log; then
              echo "crash marker found, no retry" | tee -a client-smoke.log
              break
            fi
            if grep -q -E "has successfully loaded|MinecraftForge v14.*Initialized|Narrator library" client-attempt.log; then
              break
            fi
            if grep -q -E "downloadAssets FAILED|Failed to get asset|Could not resolve|Could not GET" client-attempt.log; then
              echo "transient download failure, retrying in 10s..." | tee -a client-smoke.log
              sleep 10
              continue
            fi
            break
          done
          echo "client exit code: $CODE"
          (cp /tmp/xorg.log ./xorg.log 2>/dev/null || true)
          tail -n 100 client-smoke.log || true
          echo "--- client marker scan ---"
          grep -E -i "has successfully loaded|MinecraftForge v14.*Initialized|Narrator library|SoundSystem|Minecraft Crash Report|ExceptionInInitializerError|IllegalStateException|Attempted to set registry name|Found a duplicate mod|Caused by:" client-smoke.log | tail -n 60 || true
          if grep -q -E "Minecraft Crash Report|ExceptionInInitializerError|Attempted to set registry name|Found a duplicate mod" client-smoke.log; then
            echo "CLIENT SMOKE FAILED: crash marker found"
            exit 1
          fi
          if grep -q -E "has successfully loaded|MinecraftForge v14.*Initialized|Narrator library" client-smoke.log; then
            echo "CLIENT SMOKE PASSED: reached title-screen neighbourhood (timeout $CODE is expected, client idles)"
            exit 0
          fi
          if [ "$CODE" -eq 124 ]; then
            echo "CLIENT SMOKE FAILED: timed out without title-screen marker (see client-smoke.log)"
            exit 1
          fi
          echo "CLIENT SMOKE FAILED: exit $CODE without success marker"
          exit 1
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server-smoke.log
            forge-install.log
            client-smoke.log
            xorg.log
            smokeserver/logs/
            smokeserver/crash-reports/
            run/logs/
            run/crash-reports/
          if-no-files-found: warn

      - name: Stage stable jar name
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          ls build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Releasing $JAR"
          cp "$JAR" create-1.12.2.jar

      - name: Publish latest release
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest successful build"
          body: |
            Auto-built from `${{ github.sha }}` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            One-click install (MC 1.12.2 + Forge 14.23.5.2859):
            - `create-112-mods.zip` — unzip into `.minecraft/` (mods + deps included)
            - `create-112-prism.mrpack` — Prism Launcher: Add Instance → Import
            - `create-1.12.2.jar` — the mod alone (needs MixinBooter + MelonLib + CTM, JEI optional)

            See `create-112-manifest.json` for pinned dependency URLs + sha1.
          files: |
            create-1.12.2.jar
            dist/create-112-mods.zip
            dist/create-112-prism.mrpack
            dist/create-112-manifest.json
          draft: false
          prerelease: false
