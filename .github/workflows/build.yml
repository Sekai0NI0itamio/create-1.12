name: Build mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle + Forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg3-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-fg3-

      - name: Build with Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Set up Python for packager
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle install packs
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Bundling $JAR"
          python3 pack/pack.py "$JAR" --out dist --version "${{ github.sha }}"
          ls -la dist/

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: create-112-jar
          path: build/libs/*.jar

      - name: Install headless display deps
        if: success()
        run: |
          sudo apt-get update
          (sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri || sudo apt-get install -y xvfb mesa-utils || true)
          which Xvfb || true
          which xvfb-run || true

      - name: Dedicated server smoke (registry crash catcher)
        if: success()
        run: |
          set +e
          mkdir -p run/mods
          for j in dist/deps/*.jar; do
            case "$j" in *create-1.12.2.jar*) echo "skip $j (dev classes already on classpath)";; *) cp -n "$j" run/mods/ && echo "mod $j";; esac
          done
          ls -la run/mods/ || true
          echo "eula=true" > run/eula.txt
          timeout 300 ./gradlew runServer --no-daemon --stacktrace > server-smoke.log 2>&1
          CODE=$?
          echo "server exit code: $CODE"
          tail -n 80 server-smoke.log || true
          echo "--- server marker scan ---"
          grep -E -i "Done \(|Dedicated Server has started|Minecraft Crash Report|ExceptionInInitializerError|IllegalStateException|Attempted to set registry name|Caused by:" server-smoke.log | tail -n 40 || true
          if grep -q -E "Minecraft Crash Report|ExceptionInInitializerError|Attempted to set registry name" server-smoke.log; then
            echo "SERVER SMOKE FAILED: crash marker found"
            exit 1
          fi
          if grep -q -E "Done \(" server-smoke.log; then
            echo "SERVER SMOKE PASSED: dedicated server reached Done"
            exit 0
          fi
          if [ "$CODE" -eq 124 ]; then
            echo "SERVER SMOKE FAILED: timed out before Done (see server-smoke.log)"
            exit 1
          fi
          echo "SERVER SMOKE FAILED: exit $CODE without Done marker"
          exit 1

      - name: Headless client smoke (title screen or timeout)
        if: success()
        run: |
          set +e
          mkdir -p run/mods
          for j in dist/deps/*.jar; do
            case "$j" in *create-1.12.2.jar*) echo "skip $j";; *) cp -n "$j" run/mods/ && echo "mod $j";; esac
          done
          timeout 420 xvfb-run -a ./gradlew runClient --no-daemon --stacktrace > client-smoke.log 2>&1
          CODE=$?
          echo "client exit code: $CODE"
          tail -n 100 client-smoke.log || true
          echo "--- client marker scan ---"
          grep -E -i "has successfully loaded|MinecraftForge v14.*Initialized|Narrator library|SoundSystem|Minecraft Crash Report|ExceptionInInitializerError|IllegalStateException|Attempted to set registry name|Caused by:" client-smoke.log | tail -n 60 || true
          if grep -q -E "Minecraft Crash Report|ExceptionInInitializerError|Attempted to set registry name" client-smoke.log; then
            echo "CLIENT SMOKE FAILED: crash marker found"
            exit 1
          fi
          if grep -q -E "has successfully loaded|MinecraftForge v14.*Initialized|Narrator library" client-smoke.log; then
            echo "CLIENT SMOKE PASSED: reached title-screen neighbourhood (timeout $CODE is expected, client idles)"
            exit 0
          fi
          if [ "$CODE" -eq 124 ]; then
            echo "CLIENT SMOKE FAILED: timed out without title-screen marker (see client-smoke.log)"
            exit 1
          fi
          echo "CLIENT SMOKE FAILED: exit $CODE without success marker"
          exit 1

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server-smoke.log
            client-smoke.log
            run/logs/
            run/crash-reports/
          if-no-files-found: warn

      - name: Stage stable jar name
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          ls build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Releasing $JAR"
          cp "$JAR" create-1.12.2.jar

      - name: Publish latest release
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest successful build"
          body: |
            Auto-built from `${{ github.sha }}` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            One-click install (MC 1.12.2 + Forge 14.23.5.2859):
            - `create-112-mods.zip` — unzip into `.minecraft/` (mods + deps included)
            - `create-112-prism.mrpack` — Prism Launcher: Add Instance → Import
            - `create-1.12.2.jar` — the mod alone (needs MixinBooter + MelonLib + CTM, JEI optional)

            See `create-112-manifest.json` for pinned dependency URLs + sha1.
          files: |
            create-1.12.2.jar
            dist/create-112-mods.zip
            dist/create-112-prism.mrpack
            dist/create-112-manifest.json
          draft: false
          prerelease: false
