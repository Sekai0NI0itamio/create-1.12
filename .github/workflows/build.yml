name: Build mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle + Forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg3-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-fg3-

      - name: Build with Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Static asset audit (blockstates/models/textures)
        if: success()
        run: |
          python3 tools/audit_assets.py

      - name: Set up Python for packager
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle install packs
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Bundling $JAR"
          python3 pack/pack.py "$JAR" --out dist --version "${{ github.sha }}"
          ls -la dist/

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: create-112-jar
          path: build/libs/*.jar

      - name: Stage stable jar name
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          ls build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -i -e sources -e javadoc | head -n 1)
          echo "Releasing $JAR"
          cp "$JAR" create-1.12.2.jar

      - name: Publish latest release
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest successful build"
          body: |
            Auto-built from `${{ github.sha }}` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            One-click install (MC 1.12.2 + Forge 14.23.5.2859):
            - `create-112-mods.zip` — unzip into `.minecraft/` (mods + deps included)
            - `create-112-prism.mrpack` — Prism Launcher: Add Instance → Import
            - `create-1.12.2.jar` — the mod alone (needs MixinBooter + MelonLib + CTM, JEI optional)

            See `create-112-manifest.json` for pinned dependency URLs + sha1.
          files: |
            create-1.12.2.jar
            dist/create-112-mods.zip
            dist/create-112-prism.mrpack
            dist/create-112-manifest.json
          draft: false
          prerelease: false
